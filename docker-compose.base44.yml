services:
  web:
    image: node:22-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      - db_data:/data
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=development
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - apt-get update -qq && apt-get install -y -qq openssl > /dev/null 2>&1 && npm install --no-audit --no-fund && npx prisma db push && npx prisma db seed && exec npm run dev
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
  db_data:
